name: 🏭 FanchmWrt WH3000 Pro 自动编译

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "清理编译目录后重新编译"
        required: true
        default: false
        type: boolean

      upload_release:
        description: "编译成功后自动创建 GitHub Release"
        required: true
        default: true
        type: boolean

  push:
    paths:
      - ".github/workflows/Wh3000pro.yml"
      - "config/**"
      - "scripts/**"
      - "custom-packages/**"

permissions:
  contents: write

env:
  FANCHMWRT_TAG: fanchmwrt-25.12.4
  BUILD_DIR: openwrt
  DEVICE: huasifei_wh3000-pro-emmc

jobs:
  build:
    name: WH3000 Pro eMMC
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout build project
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Free disk space
      # ==========================================================

      - name: Free disk space
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Free disk space"
          echo "========================================"

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true

          sudo docker image prune --all --force || true

          echo
          echo "Disk status:"
          df -h


      # ==========================================================
      # 3. Install build dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            swig \
            time \
            jq \
            ccache \
            libelf-dev \
            device-tree-compiler \
            genisoimage \
            ecj \
            fastjar \
            java-propose-classpath \
            libpython3-dev

          echo
          echo "Build dependencies installed."


      # ==========================================================
      # 4. Restore download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: fanchmwrt-dl-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}
          restore-keys: |
            fanchmwrt-dl-${{ env.FANCHMWRT_TAG }}-
            fanchmwrt-dl-


      # ==========================================================
      # 5. Restore ccache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}-
            fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-
            fanchmwrt-ccache-


      # ==========================================================
      # 6. Configure ccache
      # ==========================================================

      - name: Configure ccache
        run: |
          set -euo pipefail

          mkdir -p ~/.ccache

          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=5G

          echo
          echo "ccache configuration:"
          ccache --show-config

          echo
          echo "Initial ccache statistics:"
          ccache --show-stats || true


      # ==========================================================
      # 7. Clone FanchmWrt
      # ==========================================================

      - name: Clone FanchmWrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Clone FanchmWrt"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch "${FANCHMWRT_TAG}" \
            https://github.com/fanchmwrt/fanchmwrt.git \
            "${BUILD_DIR}"

          cd "${BUILD_DIR}"

          echo
          echo "Source:"
          git log -1 --oneline

          echo
          echo "Tag:"
          git describe --tags --always

          echo
          echo "Target device:"
          echo "${DEVICE}"


      # ==========================================================
      # 8. Optional clean build
      #
      # 新鲜 clone 后通常没有必要。
      #
      # 如果用户手动选择 clean_build，
      # 在 DIY1 / prepare 前清理。
      # ==========================================================

      - name: Optional clean build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build == true }}
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " CLEAN BUILD"
          echo "========================================"

          make clean || true

          rm -rf build_dir/target-* || true
          rm -rf staging_dir/target-* || true
          rm -rf tmp || true

          echo
          echo "Clean build preparation completed."


      # ==========================================================
      # 9. DIY1
      #
      # DIY1：
      #
      #   QModem feed
      #       ↓
      #   Lucky
      #       ↓
      #   WH3000 Pro hardware verification
      #       ↓
      #   必要时 upstream fallback
      #
      # 不使用 DETECTED_DEVICE。
      # ==========================================================

      - name: DIY1 - feeds and hardware preparation
        run: |
          set -euo pipefail

          echo "========================================"
          echo " DIY1"
          echo "========================================"

          test -f scripts/diy-part1.sh

          chmod +x scripts/diy-part1.sh

          ./scripts/diy-part1.sh


      # ==========================================================
      # 10. Prepare exact WH3000 Pro target
      #
      # prepare.sh 内部唯一一次：
      #
      #   make defconfig
      #
      # 然后：
      #
      #   删除 Kconfig 自动 DEVICE
      #   强制 WH3000 Pro eMMC
      #
      # 从这里以后禁止再次 defconfig。
      # ==========================================================

      - name: Prepare exact WH3000 Pro target
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Prepare exact WH3000 Pro target"
          echo "========================================"

          test -f scripts/prepare.sh

          chmod +x scripts/prepare.sh

          ./scripts/prepare.sh


      # ==========================================================
      # 11. DIY2
      # ==========================================================

      - name: DIY2 - custom configuration
        run: |
          set -euo pipefail

          echo "========================================"
          echo " DIY2"
          echo "========================================"

          test -f scripts/diy-part2.sh

          chmod +x scripts/diy-part2.sh

          ./scripts/diy-part2.sh


      # ==========================================================
      # 12. Verify exact source hardware
      #
      # 这里只读源代码。
      #
      # 不修改 .config。
      # 不执行 defconfig。
      # ==========================================================

      - name: Verify exact WH3000 Pro source target
        working-directory: openwrt
        run: |
          set -euo pipefail

          DEVICE="${DEVICE}"

          echo "========================================"
          echo " Exact hardware verification"
          echo "========================================"

          echo
          echo "[1] Device definition"

          grep -n \
            -A20 \
            -B2 \
            "^define Device/${DEVICE}$" \
            target/linux/mediatek/image/filogic.mk

          echo
          echo "[2] Device registration"

          if grep \
            -Eq \
            "TARGET_DEVICES[[:space:]]*\+=.*${DEVICE}" \
            target/linux/mediatek/image/filogic.mk; then

            echo "✅ TARGET_DEVICES registration found."

          else

            echo "⚠️ Direct registration line not found."
            echo "Device definition exists; continue."

          fi

          echo
          echo "[3] eMMC DTS"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts

          echo "✅ eMMC DTS exists."


          echo
          echo "[4] Common WH3000 Pro DTS"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi

          echo "✅ Common DTS exists."


          echo
          echo "[5] modem-power"

          grep -n \
            -A10 \
            -B3 \
            "modem-power" \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi \
            || true


          echo
          echo "[6] Kernel version"

          grep \
            -n \
            "^KERNEL_PATCHVER" \
            target/linux/mediatek/Makefile


          echo
          echo "========================================"
          echo " Source hardware verification PASSED"
          echo "========================================"


      # ==========================================================
      # 13. Verify LOCKED .config
      #
      # 极其重要：
      #
      # 这里绝对不能：
      #
      #   make defconfig
      #   make olddefconfig
      #   make menuconfig
      #
      # 这里只读取 .config。
      # ==========================================================

      - name: Verify locked WH3000 Pro target
        working-directory: openwrt
        run: |
          set -euo pipefail

          DEVICE="${DEVICE}"
          DEVICE_SYMBOL="${DEVICE//-/_}"

          EXPECTED="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE_SYMBOL}=y"

          echo "========================================"
          echo " Verify LOCKED target"
          echo "========================================"

          echo
          echo "Expected:"
          echo "${EXPECTED}"

          echo
          echo "IMPORTANT:"
          echo "No make defconfig will be executed."


          # ------------------------------------------------------
          # 1. Exact target
          # ------------------------------------------------------

          echo
          echo "[1] Verify exact target"

          if ! grep \
            -qF \
            "${EXPECTED}" \
            .config; then

            echo
            echo "❌ ERROR: Exact WH3000 Pro target is NOT selected."

            echo
            echo "Current selected devices:"

            grep \
              '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' \
              .config \
              || true

            exit 1
          fi

          echo "✅ Exact WH3000 Pro target selected."


          # ------------------------------------------------------
          # 2. Device count
          # ------------------------------------------------------

          echo
          echo "[2] Verify selected device count"

          COUNT="$(
            grep -Ec \
              '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' \
              .config \
              || true
          )"

          echo "Selected device count: ${COUNT}"

          if [ "${COUNT}" -ne 1 ]; then

            echo
            echo "❌ ERROR: Expected exactly ONE Filogic device."

            grep \
              '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' \
              .config \
              || true

            exit 1
          fi

          echo "✅ Exactly one Filogic device selected."


          # ------------------------------------------------------
          # 3. Reject OpenWrt One
          # ------------------------------------------------------

          echo
          echo "[3] Reject OpenWrt One"

          if grep \
            -q \
            '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_openwrt_one=y$' \
            .config; then

            echo
            echo "❌ ERROR: openwrt_one was selected!"

            exit 1
          fi

          echo "✅ openwrt_one not selected."


          # ------------------------------------------------------
          # 4. MediaTek target
          # ------------------------------------------------------

          echo
          echo "[4] Verify MediaTek target"

          REQUIRED_CONFIGS=(
            "CONFIG_TARGET_mediatek=y"
            "CONFIG_TARGET_mediatek_filogic=y"
            "CONFIG_TARGET_DEVICE_mediatek_filogic=y"
          )

          for REQUIRED in "${REQUIRED_CONFIGS[@]}"; do

            if ! grep \
              -qF \
              "${REQUIRED}" \
              .config; then

              echo
              echo "❌ ERROR: Missing:"
              echo "${REQUIRED}"

              exit 1
            fi

          done

          echo "✅ MediaTek target verified."
          echo "✅ Filogic target verified."
          echo "✅ Device framework verified."


          # ------------------------------------------------------
          # 5. Print final target
          # ------------------------------------------------------

          echo
          echo "========================================"
          echo " FINAL LOCKED TARGET"
          echo "========================================"

          grep \
            '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' \
            .config


          echo
          echo "========================================"
          echo " ✅ LOCKED TARGET VERIFICATION PASSED"
          echo "========================================"


      # ==========================================================
      # 14. Download source packages
      #
      # 注意：
      # 不执行任何 defconfig。
      # ==========================================================

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Download sources"
          echo "========================================"

          make download \
            -j8 \
            V=s

          echo
          echo "Removing suspicious tiny downloads..."

          find dl \
            -type f \
            -size -1024c \
            -delete \
            || true


      # ==========================================================
      # 15. Compile firmware
      #
      # WH3000 Pro：
      #
      #   ARM / MT7981
      #   FanchmWrt 25.12.4
      #   Linux 6.12
      #
      # 使用 -j2，优先稳定性。
      # ==========================================================

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Compile FanchmWrt"
          echo "========================================"

          echo
          echo "Device:"
          echo "${DEVICE}"

          echo
          echo "Target:"
          grep \
            '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' \
            .config

          echo
          echo "Kernel:"
          grep \
            '^KERNEL_PATCHVER' \
            target/linux/mediatek/Makefile \
            || true

          echo
          echo "Starting compilation..."

          make \
            -j2 \
            V=s


      # ==========================================================
      # 16. Validate firmware output
      # ==========================================================

      - name: Validate WH3000 Pro eMMC firmware
        working-directory: openwrt
        run: |
          set -euo pipefail

          DEVICE="${DEVICE}"

          TARGET_DIR="bin/targets/mediatek/filogic"

          echo "========================================"
          echo " Firmware validation"
          echo "========================================"

          test -d "${TARGET_DIR}"


          # ------------------------------------------------------
          # All output files
          # ------------------------------------------------------

          echo
          echo "All firmware outputs:"

          find "${TARGET_DIR}" \
            -type f \
            \( \
              -name "*sysupgrade*" \
              -o -name "*factory*" \
              -o -name "*.itb" \
              -o -name "*.bin" \
            \) \
            -print \
            | sort


          # ------------------------------------------------------
          # Exact WH3000 Pro eMMC
          # ------------------------------------------------------

          echo
          echo "========================================"
          echo " Looking for exact WH3000 Pro eMMC"
          echo "========================================"

          mapfile -t SYSUPGRADE_FILES < <(
            find "${TARGET_DIR}" \
              -type f \
              -name "*${DEVICE}*sysupgrade*" \
              -print \
              | sort
          )


          if [ "${#SYSUPGRADE_FILES[@]}" -eq 0 ]; then

            echo
            echo "❌ ERROR:"
            echo "WH3000 Pro eMMC sysupgrade firmware was NOT found."

            echo
            echo "Expected device:"
            echo "${DEVICE}"

            echo
            echo "Available files:"

            find "${TARGET_DIR}" \
              -type f \
              -print \
              | sort

            exit 1
          fi


          echo
          echo "✅ WH3000 Pro eMMC firmware found:"

          printf '%s\n' "${SYSUPGRADE_FILES[@]}"


          # ------------------------------------------------------
          # Reject OpenWrt One image
          # ------------------------------------------------------

          echo
          echo "Checking forbidden OpenWrt One image..."

          if find "${TARGET_DIR}" \
              -type f \
              \( \
                -iname "*openwrt_one*" \
                -o -iname "*openwrt-one*" \
              \) \
              -print \
              -quit \
              | grep -q .; then

            echo
            echo "❌ ERROR: openwrt_one image detected!"

            exit 1
          fi

          echo "✅ No OpenWrt One image detected."


          # ------------------------------------------------------
          # Target metadata
          # ------------------------------------------------------

          echo
          echo "========================================"
          echo " Target metadata"
          echo "========================================"

          for file in \
            "${TARGET_DIR}/profiles.json" \
            "${TARGET_DIR}/version.buildinfo" \
            "${TARGET_DIR}/config.buildinfo"
          do

            if [ -f "${file}" ]; then

              echo
              echo "--- ${file}"

              grep \
                -i \
                -E \
                "wh3000|huasifei|filogic" \
                "${file}" \
                | head -50 \
                || true

            fi

          done


          # ------------------------------------------------------
          # SHA256
          # ------------------------------------------------------

          echo
          echo "========================================"
          echo " SHA256"
          echo "========================================"

          find bin/targets \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > sha256sums.txt

          cat sha256sums.txt


          echo
          echo "========================================"
          echo " ✅ FIRMWARE VALIDATION PASSED"
          echo "========================================"


      # ==========================================================
      # 17. Collect release files
      # ==========================================================

      - name: Collect release files
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Collect release files"
          echo "========================================"

          rm -rf release

          mkdir -p release


          # ------------------------------------------------------
          # Firmware
          # ------------------------------------------------------

          find \
            openwrt/bin/targets/mediatek/filogic \
            -type f \
            \( \
              -name "*sysupgrade*" \
              -o -name "*factory*" \
              -o -name "*.itb" \
              -o -name "*.bin" \
            \) \
            -exec cp -t release {} +


          # ------------------------------------------------------
          # SHA256
          # ------------------------------------------------------

          if [ -f openwrt/sha256sums.txt ]; then

            cp \
              openwrt/sha256sums.txt \
              release/

          fi


          # ------------------------------------------------------
          # Kernel version
          # ------------------------------------------------------

          KERNEL_VERSION="$(
            grep \
              '^KERNEL_PATCHVER' \
              openwrt/target/linux/mediatek/Makefile \
              | awk -F= '
                {
                  gsub(/[[:space:]]/, "", $2);
                  print $2
                }
              '
          )"


          # ------------------------------------------------------
          # BUILD INFO
          # ------------------------------------------------------

          cat > release/BUILD-INFO.txt <<EOF
FanchmWrt: ${FANCHMWRT_TAG}

Device: ${DEVICE}

Target: mediatek/filogic

Exact Profile:
huasifei_wh3000-pro-emmc

Kconfig:
CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_huasifei_wh3000_pro_emmc=y

DTS:
mt7981b-huasifei-wh3000-pro-emmc

Kernel:
Linux ${KERNEL_VERSION}

Build Number:
${GITHUB_RUN_NUMBER}

Commit:
${GITHUB_SHA}

Date:
$(date -u '+%Y-%m-%d %H:%M:%S UTC')

QModem:
FUjr/QModem main

Lucky:
gdy666/luci-app-lucky main

Docker:
enabled

Hardware verification:
enabled

OpenWrt One rejection:
enabled

Target locking:
enabled

Post-prepare defconfig:
DISABLED
EOF


          # ------------------------------------------------------
          # TARGET VERIFY
          # ------------------------------------------------------

          cat > release/TARGET-VERIFY.txt <<EOF
============================================================
FanchmWrt WH3000 Pro eMMC Hardware Verification
============================================================

Target:
${DEVICE}

Platform:
mediatek/filogic

Kconfig:
CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_huasifei_wh3000_pro_emmc=y

DTS:
mt7981b-huasifei-wh3000-pro-emmc

Kernel:
Linux ${KERNEL_VERSION}

OpenWrt One rejection:
enabled

Target locking:
enabled

Post-prepare defconfig:
DISABLED

============================================================
EOF


          # ------------------------------------------------------
          # Release file check
          # ------------------------------------------------------

          echo
          echo "Release files:"

          ls -lah release/


          if ! find release \
              -maxdepth 1 \
              -type f \
              -name "*${DEVICE}*sysupgrade*" \
              -print \
              -quit \
              | grep -q .; then

            echo
            echo "❌ ERROR:"
            echo "Exact WH3000 Pro sysupgrade file was not copied."

            exit 1
          fi


          echo
          echo "========================================"
          echo " ✅ RELEASE COLLECTION PASSED"
          echo "========================================"


      # ==========================================================
      # 18. Show ccache statistics
      # ==========================================================

      - name: Show ccache statistics
        if: always()
        run: |
          set +e

          echo "========================================"
          echo " ccache statistics"
          echo "========================================"

          ccache --show-stats || true


      # ==========================================================
      # 19. Upload Actions artifact
      # ==========================================================

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-WH3000-Pro-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 20. GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_release == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Create GitHub Release"
          echo "========================================"


          TAG="WH3000Pro-${FANCHMWRT_TAG}-${GITHUB_RUN_NUMBER}"

          TITLE="WH3000 Pro | FanchmWrt ${FANCHMWRT_TAG} | #${GITHUB_RUN_NUMBER}"


          # ------------------------------------------------------
          # Collect files safely
          # ------------------------------------------------------

          FILES=()

          while IFS= read -r -d '' file; do
            FILES+=("${file}")
          done < <(
            find release \
              -maxdepth 1 \
              -type f \
              -print0 \
              | sort -z
          )


          if [ "${#FILES[@]}" -eq 0 ]; then

            echo
            echo "❌ ERROR: No release files found."

            exit 1
          fi


          echo
          echo "Files to upload:"

          printf '  %s\n' "${FILES[@]}"


          # ------------------------------------------------------
          # Release notes
          # ------------------------------------------------------

          NOTES_FILE="$(mktemp)"


          cat > "${NOTES_FILE}" <<EOF
FanchmWrt ${FANCHMWRT_TAG}

Huasifei WH3000 Pro eMMC

Exact hardware target:
${DEVICE}

Target:
mediatek/filogic

DTS:
mt7981b-huasifei-wh3000-pro-emmc

Kernel:
Linux ${KERNEL_VERSION:-unknown}

QModem:
FUjr/QModem main

Lucky:
gdy666/luci-app-lucky main

Docker:
enabled

Hardware target verification:
enabled

OpenWrt One rejection:
enabled

Target locking:
enabled

Post-prepare defconfig:
DISABLED

Build number:
${GITHUB_RUN_NUMBER}

Commit:
${GITHUB_SHA}
EOF


          # ------------------------------------------------------
          # Create Release
          # ------------------------------------------------------

          gh release create \
            "${TAG}" \
            "${FILES[@]}" \
            --title "${TITLE}" \
            --notes-file "${NOTES_FILE}"


          rm -f "${NOTES_FILE}"


          echo
          echo "========================================"
          echo " ✅ GitHub Release created successfully"
          echo "========================================"

          echo
          echo "Release tag:"
          echo "${TAG}"
