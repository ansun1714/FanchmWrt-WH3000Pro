name: 🏭 FanchmWrt WH3000 Pro 自动编译

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "清理编译目录后重新编译"
        required: true
        default: false
        type: boolean

      upload_release:
        description: "编译成功后自动创建 GitHub Release"
        required: true
        default: true
        type: boolean

  push:
    paths:
      - ".github/workflows/Wh3000pro.yml"
      - "config/**"
      - "scripts/**"
      - "custom-packages/**"

permissions:
  contents: write

env:
  FANCHMWRT_TAG: fanchmwrt-25.12.4
  BUILD_DIR: openwrt
  DEVICE: huasifei_wh3000-pro-emmc
  TARGET: mediatek/filogic

jobs:
  build:
    name: WH3000 Pro eMMC
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout build project
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Free disk space
      # ==========================================================

      - name: Free disk space
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Free disk space"
          echo "========================================"

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true

          sudo docker image prune --all --force || true

          echo
          echo "Disk status:"
          df -h


      # ==========================================================
      # 3. Install build dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            swig \
            time \
            jq \
            ccache \
            libelf-dev \
            device-tree-compiler \
            genisoimage \
            ecj \
            fastjar \
            java-propose-classpath \
            libpython3-dev


      # ==========================================================
      # 4. Restore download cache
      # ==========================================================

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: fanchmwrt-dl-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            fanchmwrt-dl-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}-
            fanchmwrt-dl-${{ env.FANCHMWRT_TAG }}-
            fanchmwrt-dl-


      # ==========================================================
      # 5. Restore ccache
      # ==========================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}-
            fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-
            fanchmwrt-ccache-


      # ==========================================================
      # 6. Configure ccache
      # ==========================================================

      - name: Configure ccache
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ccache"

          ccache --set-config=cache_dir="${HOME}/.ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          ccache --zero-stats

          echo
          echo "ccache configuration:"
          ccache --show-config


      # ==========================================================
      # 7. Clone FanchmWrt
      # ==========================================================

      - name: Clone FanchmWrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Clone FanchmWrt"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch "${FANCHMWRT_TAG}" \
            https://github.com/fanchmwrt/fanchmwrt.git \
            "${BUILD_DIR}"

          cd "${BUILD_DIR}"

          echo
          echo "Source commit:"
          git log -1 --oneline

          echo
          echo "Source tag:"
          git describe --tags --always

          echo
          echo "Target device:"
          echo "${DEVICE}"


      # ==========================================================
      # 8. Optional clean build
      #
      # 必须在 prepare.sh 之前执行
      #
      # prepare.sh 锁定目标之后不能再破坏 .config
      # ==========================================================

      - name: Optional clean build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build == true }}
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " CLEAN BUILD"
          echo "========================================"

          make clean || true

          rm -rf build_dir/target-* || true
          rm -rf staging_dir/target-* || true
          rm -rf tmp || true

          echo
          echo "Clean build preparation completed."


      # ==========================================================
      # 9. DIY1
      #
      # 顺序：
      #
      # Clone
      #   ↓
      # Clean
      #   ↓
      # DIY1
      #   ↓
      # prepare
      #   ↓
      # DIY2
      #
      # DIY1 负责：
      # QModem
      # Lucky
      # WH3000 Pro 硬件支持检查
      # 必要时 upstream fallback
      # ==========================================================

      - name: DIY1 - feeds and hardware support
        run: |
          set -euo pipefail

          echo "========================================"
          echo " DIY1"
          echo "========================================"

          test -f scripts/diy-part1.sh

          chmod +x scripts/diy-part1.sh

          ./scripts/diy-part1.sh


      # ==========================================================
      # 10. Prepare exact WH3000 Pro target
      #
      # prepare.sh 内部负责：
      # 1. 复制基础 .config
      # 2. 清除所有 Filogic DEVICE
      # 3. make defconfig 一次
      # 4. 再锁定 WH3000 Pro
      # 5. 最终验证
      #
      # 注意：
      # workflow 后面绝对不能再次 make defconfig
      # ==========================================================

      - name: Prepare exact WH3000 Pro target
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Prepare exact hardware target"
          echo "========================================"

          test -f scripts/prepare.sh

          chmod +x scripts/prepare.sh

          ./scripts/prepare.sh


      # ==========================================================
      # 11. DIY2
      #
      # DIY2 只处理 files/ 和运行时配置
      # 不修改 .config
      # ==========================================================

      - name: DIY2 - custom configuration
        run: |
          set -euo pipefail

          echo "========================================"
          echo " DIY2"
          echo "========================================"

          test -f scripts/diy-part2.sh

          chmod +x scripts/diy-part2.sh

          ./scripts/diy-part2.sh


      # ==========================================================
      # 12. Verify exact source hardware
      # ==========================================================

      - name: Verify exact WH3000 Pro source target
        working-directory: openwrt
        run: |
          set -euo pipefail

          DEVICE="${DEVICE}"

          echo "========================================"
          echo " Exact hardware verification"
          echo "========================================"


          echo
          echo "[1] Device definition"

          grep -n \
            -A20 \
            -B2 \
            "^define Device/${DEVICE}$" \
            target/linux/mediatek/image/filogic.mk


          echo
          echo "[2] Device registration"

          grep -n \
            -E \
            "^TARGET_DEVICES[[:space:]]*\+=[[:space:]]*${DEVICE}[[:space:]]*$" \
            target/linux/mediatek/image/filogic.mk


          echo
          echo "[3] eMMC DTS"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts

          echo "OK: eMMC DTS exists"


          echo
          echo "[4] Common WH3000 Pro DTS"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi

          echo "OK: common DTS exists"


          echo
          echo "[5] Kernel patch version"

          grep \
            -n \
            "^KERNEL_PATCHVER" \
            target/linux/mediatek/Makefile


          echo
          echo "========================================"
          echo " Source hardware verification PASSED"
          echo "========================================"


      # ==========================================================
      # 13. Verify locked .config
      #
      # 重要：
      # 这里仅检查 .config
      #
      # 不运行：
      # make defconfig
      #
      # 不运行：
      # make menuconfig
      #
      # 不重新生成 .config
      # ==========================================================

      - name: Verify locked .config
        working-directory: openwrt
        run: |
          set -euo pipefail

          DEVICE_SYMBOL="${DEVICE//-/_}"

          EXPECTED="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE_SYMBOL}=y"


          echo "========================================"
          echo " Locked target configuration"
          echo "========================================"


          echo
          echo "[1] Target configuration"

          grep \
            -E \
            "^CONFIG_TARGET_(mediatek|DEVICE_mediatek_filogic|SUBTARGET|DEVICE_mediatek_filogic_DEVICE_)" \
            .config \
            || true


          echo
          echo "[2] Required target checks"

          grep -qF \
            "CONFIG_TARGET_mediatek=y" \
            .config

          grep -qF \
            "CONFIG_TARGET_mediatek_filogic=y" \
            .config

          grep -qF \
            "CONFIG_TARGET_DEVICE_mediatek_filogic=y" \
            .config


          echo
          echo "[3] Exact device"

          if ! grep -qF "${EXPECTED}" .config; then

            echo
            echo "ERROR: Exact WH3000 Pro target is NOT selected."

            echo
            echo "Selected devices:"

            grep \
              "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y" \
              .config \
              || true

            exit 1
          fi


          echo
          echo "[4] Device count"

          COUNT="$(
            grep -Ec \
              "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$" \
              .config \
              || true
          )"

          echo "Selected Filogic device count: ${COUNT}"

          if [ "${COUNT}" -ne 1 ]; then
            echo "ERROR: expected exactly one selected Filogic device."
            exit 1
          fi


          echo
          echo "[5] OpenWrt One rejection"

          if grep -q \
            "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_openwrt_one=y$" \
            .config; then

            echo "ERROR: OpenWrt One is selected."

            exit 1
          fi


          echo
          echo "========================================"
          echo " FINAL LOCKED TARGET"
          echo "========================================"

          grep \
            "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y" \
            .config

          echo
          echo "Exact target verification PASSED."

          echo
          echo "IMPORTANT:"
          echo "No make defconfig will be executed after this step."


      # ==========================================================
      # 14. Download source packages
      # ==========================================================

      - name: Download source packages
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Download sources"
          echo "========================================"

          make download \
            -j8 \
            V=s


          echo
          echo "Removing suspicious tiny downloads..."

          find dl \
            -type f \
            -size -1024c \
            -delete \
            || true


      # ==========================================================
      # 15. Compile
      #
      # 当前先使用 -j2
      #
      # 原因：
      # WH3000 Pro / GitHub runner 稳定优先
      # ccache 命中后速度会明显提升
      # ==========================================================

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Compile FanchmWrt"
          echo "========================================"

          echo
          echo "Device:"
          echo "${DEVICE}"

          echo
          echo "Kernel:"
          grep \
            "^KERNEL_PATCHVER" \
            target/linux/mediatek/Makefile \
            || true


          START_EPOCH="$(date +%s)"

          echo
          echo "Starting compilation..."

          make \
            -j2 \
            V=s


          END_EPOCH="$(date +%s)"

          ELAPSED="$((END_EPOCH - START_EPOCH))"

          echo
          echo "Compile elapsed: ${ELAPSED} seconds"


      # ==========================================================
      # 16. Validate firmware output
      # ==========================================================

      - name: Validate WH3000 Pro eMMC firmware
        working-directory: openwrt
        run: |
          set -euo pipefail

          DEVICE="${DEVICE}"

          TARGET_DIR="bin/targets/mediatek/filogic"


          echo "========================================"
          echo " Firmware validation"
          echo "========================================"

          test -d "${TARGET_DIR}"


          echo
          echo "All firmware outputs:"

          find "${TARGET_DIR}" \
            -type f \
            \( \
              -name "*sysupgrade*" \
              -o -name "*factory*" \
              -o -name "*.itb" \
              -o -name "*.bin" \
            \) \
            -print \
            | sort


          echo
          echo "========================================"
          echo " Looking for exact WH3000 Pro eMMC"
          echo "========================================"


          mapfile -t SYSUPGRADE_FILES < <(
            find "${TARGET_DIR}" \
              -type f \
              -name "*${DEVICE}*sysupgrade*" \
              -print \
              | sort
          )


          if [ "${#SYSUPGRADE_FILES[@]}" -eq 0 ]; then

            echo
            echo "ERROR:"
            echo "WH3000 Pro eMMC sysupgrade firmware was NOT found."

            echo
            echo "Expected device:"
            echo "${DEVICE}"

            echo
            echo "Available files:"

            find "${TARGET_DIR}" \
              -type f \
              -print \
              | sort

            exit 1
          fi


          echo
          echo "WH3000 Pro eMMC firmware found:"

          printf '%s\n' \
            "${SYSUPGRADE_FILES[@]}"


          # ======================================================
          # Reject OpenWrt One
          # ======================================================

          echo
          echo "Checking forbidden OpenWrt One image..."

          if find "${TARGET_DIR}" \
              -type f \
              \( \
                -iname "*openwrt_one*" \
                -o -iname "*openwrt-one*" \
              \) \
              -print \
              -quit \
              | grep -q .; then

            echo
            echo "ERROR: OpenWrt One image detected!"

            exit 1
          fi


          # ======================================================
          # SHA256
          # ======================================================

          echo
          echo "========================================"
          echo " SHA256"
          echo "========================================"

          find bin/targets \
            -type f \
            -print0 \
            | xargs -0 sha256sum \
            > sha256sums.txt

          cat sha256sums.txt


          echo
          echo "========================================"
          echo " FIRMWARE VALIDATION PASSED"
          echo "========================================"


      # ==========================================================
      # 17. Collect release files
      #
      # 注意：
      # 不使用 heredoc
      # 防止 GitHub Actions YAML 解析错误
      # ==========================================================

      - name: Collect release files
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Collect release files"
          echo "========================================"

          rm -rf release

          mkdir -p release


          # ======================================================
          # Firmware
          # ======================================================

          find \
            openwrt/bin/targets/mediatek/filogic \
            -type f \
            \( \
              -name "*sysupgrade*" \
              -o -name "*factory*" \
              -o -name "*.itb" \
              -o -name "*.bin" \
            \) \
            -exec cp -t release {} +


          # ======================================================
          # SHA256
          # ======================================================

          if [ -f openwrt/sha256sums.txt ]; then

            cp \
              openwrt/sha256sums.txt \
              release/

          fi


          # ======================================================
          # Kernel version
          # ======================================================

          KERNEL_VERSION="$(
            awk -F= '
              /^KERNEL_PATCHVER[[:space:]]*=/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
                exit
              }
            ' \
            openwrt/target/linux/mediatek/Makefile
          )"


          # ======================================================
          # BUILD INFO
          #
          # 使用 printf
          # 不使用 heredoc
          # ======================================================

          {
            printf '%s\n' "FanchmWrt: ${FANCHMWRT_TAG}"
            printf '%s\n' ""
            printf '%s\n' "Device: ${DEVICE}"
            printf '%s\n' "Target: mediatek/filogic"
            printf '%s\n' "Exact Profile: huasifei_wh3000-pro-emmc"
            printf '%s\n' ""
            printf '%s\n' "Kconfig:"
            printf '%s\n' "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_huasifei_wh3000_pro_emmc=y"
            printf '%s\n' ""
            printf '%s\n' "DTS: mt7981b-huasifei-wh3000-pro-emmc"
            printf '%s\n' "Kernel: Linux ${KERNEL_VERSION}"
            printf '%s\n' "Build Number: ${GITHUB_RUN_NUMBER}"
            printf '%s\n' "Commit: ${GITHUB_SHA}"
            printf '%s\n' "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            printf '%s\n' ""
            printf '%s\n' "QModem: FUjr/QModem main"
            printf '%s\n' "Lucky: gdy666/luci-app-lucky main"
            printf '%s\n' "Docker: enabled"
            printf '%s\n' "Exact hardware verification: enabled"
            printf '%s\n' "OpenWrt One rejection: enabled"
          } > release/BUILD-INFO.txt


          # ======================================================
          # TARGET VERIFY
          # ======================================================

          {
            printf '%s\n' "============================================================"
            printf '%s\n' "FanchmWrt WH3000 Pro eMMC Hardware Verification"
            printf '%s\n' "============================================================"
            printf '%s\n' ""
            printf '%s\n' "Target: ${DEVICE}"
            printf '%s\n' "Platform: mediatek/filogic"
            printf '%s\n' ""
            printf '%s\n' "Kconfig:"
            printf '%s\n' "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_huasifei_wh3000_pro_emmc=y"
            printf '%s\n' ""
            printf '%s\n' "DTS: mt7981b-huasifei-wh3000-pro-emmc"
            printf '%s\n' "Kernel: Linux ${KERNEL_VERSION}"
            printf '%s\n' ""
            printf '%s\n' "OpenWrt One rejection: enabled"
            printf '%s\n' "Exact hardware verification: enabled"
            printf '%s\n' ""
            printf '%s\n' "============================================================"
          } > release/TARGET-VERIFY.txt


          # ======================================================
          # Release file check
          # ======================================================

          echo
          echo "Release files:"

          ls -lah release/


          if ! find release \
              -maxdepth 1 \
              -type f \
              -name "*${DEVICE}*sysupgrade*" \
              -print \
              -quit \
              | grep -q .; then

            echo
            echo "ERROR:"
            echo "Exact WH3000 Pro sysupgrade file was not copied."

            exit 1
          fi


          echo
          echo "Release collection PASSED."


      # ==========================================================
      # 18. Show ccache statistics
      # ==========================================================

      - name: Show ccache statistics
        if: always()
        run: |
          ccache --show-stats || true


      # ==========================================================
      # 19. Upload Actions artifact
      # ==========================================================

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-WH3000-Pro-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 20. Create GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_release == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Create GitHub Release"
          echo "========================================"


          TAG="WH3000Pro-${FANCHMWRT_TAG}-${GITHUB_RUN_NUMBER}"

          TITLE="WH3000 Pro | FanchmWrt ${FANCHMWRT_TAG} | #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp)"


          # ======================================================
          # Release notes
          #
          # 使用 printf
          # 不使用 heredoc
          # ======================================================

          {
            printf '%s\n' "FanchmWrt ${FANCHMWRT_TAG}"
            printf '%s\n' ""
            printf '%s\n' "Huasifei WH3000 Pro eMMC"
            printf '%s\n' ""
            printf '%s\n' "Exact hardware target: ${DEVICE}"
            printf '%s\n' "Target: mediatek/filogic"
            printf '%s\n' "DTS: mt7981b-huasifei-wh3000-pro-emmc"
            printf '%s\n' ""
            printf '%s\n' "QModem: FUjr/QModem main"
            printf '%s\n' "Lucky: gdy666/luci-app-lucky main"
            printf '%s\n' "Docker: enabled"
            printf '%s\n' "Exact hardware verification: enabled"
            printf '%s\n' "OpenWrt One rejection: enabled"
            printf '%s\n' ""
            printf '%s\n' "Build number: ${GITHUB_RUN_NUMBER}"
            printf '%s\n' "Commit: ${GITHUB_SHA}"
          } > "${NOTES_FILE}"


          # ======================================================
          # Collect release files
          # ======================================================

          mapfile -d '' FILES < <(
            find release \
              -maxdepth 1 \
              -type f \
              -print0 \
              | sort -z
          )


          if [ "${#FILES[@]}" -eq 0 ]; then

            echo "ERROR: No release files found."

            rm -f "${NOTES_FILE}"

            exit 1
          fi


          echo
          echo "Files to upload:"

          printf '  %s\n' \
            "${FILES[@]}"


          # ======================================================
          # Create Release
          # ======================================================

          gh release create \
            "${TAG}" \
            "${FILES[@]}" \
            --title "${TITLE}" \
            --notes-file "${NOTES_FILE}"


          rm -f "${NOTES_FILE}"


          echo
          echo "========================================"
          echo " GitHub Release created successfully"
          echo "========================================"

          echo
          echo "Release tag:"
          echo "${TAG}"
