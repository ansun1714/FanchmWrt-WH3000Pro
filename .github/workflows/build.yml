name: 🏭 FanchmWrt WH3000 Pro 自动编译

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "是否执行干净编译"
        required: true
        default: false
        type: boolean

      upload_release:
        description: "编译完成后上传 GitHub Release"
        required: true
        default: true
        type: boolean

  push:
    paths:
      - ".github/workflows/build.yml"
      - "config/wh3000pro.config"
      - "scripts/**"

permissions:
  contents: write

env:
  FANCHMWRT_TAG: fanchmwrt-25.12.4
  BUILD_DIR: openwrt

  # ============================================================
  # ★★★ WH3000 Pro eMMC Device ID
  # ============================================================
  DEVICE: huasifei_wh3000-pro-emmc

  # ============================================================
  # ★★★ 注意：
  # 不能使用 TARGET，否则会污染 Docker CLI 构建环境
  # ============================================================
  OPENWRT_TARGET: mediatek/filogic

jobs:

  build:
    name: "WH3000 Pro eMMC 编译"
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: 1️⃣ Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 显示运行环境
      # ============================================================
      - name: 2️⃣ 显示运行环境
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " FanchmWrt WH3000 Pro Build"
          echo "============================================================"

          echo
          echo "Workspace:"
          echo "${GITHUB_WORKSPACE}"

          echo
          echo "Runner:"
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Device:"
          echo "${DEVICE}"

          echo
          echo "OpenWrt Target:"
          echo "${OPENWRT_TARGET}"

          echo
          echo "FanchmWrt:"
          echo "${FANCHMWRT_TAG}"

          echo
          echo "Checking dangerous TARGET variable:"

          if [ -n "${TARGET:-}" ]; then
            echo "❌ ERROR: TARGET=${TARGET}"
            echo "TARGET 会污染第三方 package 构建环境"
            exit 1
          fi

          echo "✅ TARGET 未设置"

      # ============================================================
      # 3. 安装编译依赖
      # ============================================================
      - name: 3️⃣ 安装编译依赖
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            ccache \
            jq

      # ============================================================
      # 4. 配置 ccache
      # ============================================================
      - name: 4️⃣ 配置编译缓存
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=${HOME}/.ccache"

          ccache -s

      # ============================================================
      # 5. 缓存源码下载
      # ============================================================
      - name: 5️⃣ 缓存源码下载
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
          key: |
            fanchmwrt-${{ env.FANCHMWRT_TAG }}-dl-${{ runner.os }}-${{ hashFiles('config/wh3000pro.config') }}
          restore-keys: |
            fanchmwrt-${{ env.FANCHMWRT_TAG }}-dl-${{ runner.os }}-

      # ============================================================
      # 6. 缓存 ccache
      # ============================================================
      - name: 6️⃣ 缓存 ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: |
            fanchmwrt-${{ env.FANCHMWRT_TAG }}-ccache-${{ runner.os }}-${{ hashFiles('config/wh3000pro.config') }}
          restore-keys: |
            fanchmwrt-${{ env.FANCHMWRT_TAG }}-ccache-${{ runner.os }}-

      # ============================================================
      # 7. 克隆 FanchmWrt
      # ============================================================
      - name: 7️⃣ 克隆 FanchmWrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " 克隆 FanchmWrt"
          echo "============================================================"

          rm -rf "${BUILD_DIR}"

          git clone \
            --depth=1 \
            --branch "${FANCHMWRT_TAG}" \
            https://github.com/fanchmwrt/fanchmwrt.git \
            "${BUILD_DIR}"

          cd "${BUILD_DIR}"

          echo
          echo "Git remote:"
          git remote -v

          echo
          echo "Git version:"
          git describe --tags --always || true

          echo
          echo "Git commit:"
          git rev-parse HEAD

      # ============================================================
      # 8. 克隆后检查 DTS
      # ============================================================
      - name: 8️⃣ DEBUG - 克隆后检查 WH3000 Pro DTS
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " DEBUG 1 - AFTER CLONE"
          echo "============================================================"

          echo
          echo "Git:"
          git describe --tags --always || true
          git rev-parse HEAD

          echo
          echo "FanchmWrt WH3000 相关 DTS:"

          find target/linux/mediatek/dts \
            -maxdepth 1 \
            -type f \
            -iname "*huasifei*" \
            -print \
            | sort

          echo
          echo "检查精确 DTS:"

          DTS="target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts"

          echo "${DTS}"

          if [ ! -f "${DTS}" ]; then
            echo
            echo "============================================================"
            echo "❌ FATAL: DTS 在刚克隆后就不存在"
            echo "============================================================"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "✅ DTS EXISTS AFTER CLONE"
          echo "============================================================"

      # ============================================================
      # 9. 可选干净编译
      # ============================================================
      - name: 9️⃣ 执行干净编译清理
        if: ${{ inputs.clean_build == true }}
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " 执行干净编译清理"
          echo "============================================================"

          rm -rf build_dir
          rm -rf staging_dir
          rm -rf tmp

          echo
          echo "清理完成。"

          echo
          echo "再次确认 WH3000 Pro DTS:"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi

          echo
          echo "✅ 清理后 DTS 仍然存在"

      # ============================================================
      # 10. DIY Part 1
      # ============================================================
      - name: 🔟 执行 DIY Part 1
        run: |
          set -euo pipefail

          chmod +x scripts/diy-part1.sh

          echo "============================================================"
          echo " 执行 DIY PART 1"
          echo "============================================================"

          DEVICE="${DEVICE}" \
          GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
          ./scripts/diy-part1.sh

      # ============================================================
      # 11. DIY1 后检查 DTS
      # ============================================================
      - name: 1️⃣1️⃣ DEBUG - DIY1 后检查 WH3000 Pro DTS
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " DEBUG 2 - AFTER DIY1"
          echo "============================================================"

          echo
          echo "Git:"
          git describe --tags --always || true
          git rev-parse HEAD

          echo
          echo "WH3000 相关 DTS:"

          find target/linux/mediatek/dts \
            -maxdepth 1 \
            -type f \
            -iname "*huasifei*" \
            -print \
            | sort

          echo
          echo "检查精确 DTS:"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts

          echo
          echo "============================================================"
          echo "✅ DTS EXISTS AFTER DIY1"
          echo "============================================================"

      # ============================================================
      # 12. Prepare
      # ============================================================
      - name: 1️⃣2️⃣ Prepare WH3000 Pro 配置
        run: |
          set -euo pipefail

          chmod +x scripts/prepare.sh

          echo "============================================================"
          echo " 执行 PREPARE"
          echo "============================================================"

          DEVICE="${DEVICE}" \
          GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
          ./scripts/prepare.sh

      # ============================================================
      # 13. Prepare 后 DTS 检查
      # ============================================================
      - name: 1️⃣3️⃣ DEBUG - Prepare 后检查 DTS
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " DEBUG 3 - AFTER PREPARE"
          echo "============================================================"

          echo
          echo "检查 WH3000 Pro DTS:"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts

          echo
          echo "检查 common DTS:"

          test -f \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi

          echo
          echo "============================================================"
          echo "✅ DTS EXISTS AFTER PREPARE"
          echo "============================================================"

      # ============================================================
      # 14. 最终硬件定义检查
      # ============================================================
      - name: 1️⃣4️⃣ 最终 WH3000 Pro 硬件检查
        working-directory: openwrt
        run: |
          set -euo pipefail

          DEVICE_MK="target/linux/mediatek/image/filogic.mk"

          echo "============================================================"
          echo " 最终 WH3000 Pro 硬件检查"
          echo "============================================================"

          echo
          echo "Device definition:"

          grep -n -A18 -B2 \
            "^define Device/huasifei_wh3000-pro-emmc$" \
            "${DEVICE_MK}"

          echo
          echo "TARGET_DEVICES:"

          grep -n \
            "^TARGET_DEVICES += huasifei_wh3000-pro-emmc$" \
            "${DEVICE_MK}"

          echo
          echo "DTS:"

          ls -lh \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi

          echo
          echo "============================================================"
          echo "✅ 硬件定义检查通过"
          echo "============================================================"

      # ============================================================
      # 15. 最终锁定 .config
      # ============================================================
      - name: 1️⃣5️⃣ 检查并锁定 .config
        working-directory: openwrt
        run: |
          set -euo pipefail

          TARGET_CONFIG="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_huasifei_wh3000_pro_emmc=y"

          echo "============================================================"
          echo " .config 最终检查"
          echo "============================================================"

          echo
          echo "Target:"
          grep '^CONFIG_TARGET' .config || true

          echo
          echo "============================================================"
          echo " 检查 MediaTek"
          echo "============================================================"

          grep -q '^CONFIG_TARGET_mediatek=y$' .config

          echo "✅ CONFIG_TARGET_mediatek=y"

          echo
          echo "============================================================"
          echo " 检查 Filogic"
          echo "============================================================"

          grep -q '^CONFIG_TARGET_mediatek_filogic=y$' .config

          echo "✅ CONFIG_TARGET_mediatek_filogic=y"

          echo
          echo "============================================================"
          echo " 检查精确 WH3000 Pro eMMC"
          echo "============================================================"

          grep -q "^${TARGET_CONFIG}$" .config

          echo "✅ ${TARGET_CONFIG}"

          echo
          echo "============================================================"
          echo " 检查 OpenWrt One"
          echo "============================================================"

          if grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_openwrt_one=y$' \
            .config; then

            echo "❌ 错误：选择了 OpenWrt One"
            exit 1
          fi

          echo "✅ 没有 OpenWrt One 设备"

          echo
          echo "============================================================"
          echo " 检查 TARGET_PROFILE"
          echo "============================================================"

          if grep -q '^CONFIG_TARGET_PROFILE=' .config; then
            echo "❌ 错误：仍然存在 CONFIG_TARGET_PROFILE"

            grep '^CONFIG_TARGET_PROFILE=' .config || true

            exit 1
          fi

          echo "✅ 没有 CONFIG_TARGET_PROFILE"

          echo
          echo "============================================================"
          echo " 检查设备数量"
          echo "============================================================"

          DEVICE_COUNT="$(
            grep -E \
              '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' \
              .config \
              | wc -l
          )"

          echo "DEVICE_COUNT=${DEVICE_COUNT}"

          if [ "${DEVICE_COUNT}" -ne 1 ]; then

            echo "❌ Filogic 设备数量不是 1"

            grep -E \
              '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' \
              .config \
              || true

            exit 1
          fi

          echo "✅ Filogic 只有一个设备"

          echo
          echo "============================================================"
          echo " 最终设备配置"
          echo "============================================================"

          grep -E \
            '^CONFIG_TARGET_(mediatek|TARGET|DEVICE)' \
            .config \
            || true

          echo
          echo "============================================================"
          echo "✅ .config 检查通过"
          echo " WH3000 Pro eMMC 已锁定"
          echo "============================================================"

      # ============================================================
      # 16. 下载编译依赖
      # ============================================================
      - name: 1️⃣6️⃣ 下载编译依赖
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " 下载编译依赖"
          echo "============================================================"

          make download -j4 V=s
          
      # ============================================================
      # 17. 编译
      # ============================================================
      - name: 1️⃣7️⃣ 编译 WH3000 Pro
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " 开始编译 WH3000 Pro"
          echo "============================================================"

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "开始时间:"
          date

          echo
          echo "OpenWrt Target:"
          echo "${OPENWRT_TARGET}"

          echo
          echo "Device:"
          echo "${DEVICE}"

          echo
          echo "清除可能污染第三方 package 的 TARGET 环境变量"

          unset TARGET

          if [ -n "${TARGET:-}" ]; then
            echo "❌ ERROR: TARGET 仍然存在"
            exit 1
          fi

          echo "✅ TARGET 已清除"

          echo
          echo "编译命令:"
          echo "make -j2 V=s"

          make -j2 V=s

          echo
          echo "结束时间:"
          date

          echo
          echo "============================================================"
          echo "✅ 编译命令正常结束"
          echo "============================================================"

      # ============================================================
      # 18. 查找编译结果
      # ============================================================
      - name: 1️⃣8️⃣ 查找编译结果
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " 固件输出检查"
          echo "============================================================"

          echo
          echo "bin/targets:"

          find bin/targets \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "WH3000 Pro sysupgrade:"

          find bin/targets \
            -type f \
            \( \
              -iname "*wh3000*sysupgrade*" \
              -o \
              -iname "*huasifei*sysupgrade*" \
            \) \
            -print \
            | sort

          COUNT="$(
            find bin/targets \
              -type f \
              \( \
                -iname "*wh3000*sysupgrade*" \
                -o \
                -iname "*huasifei*sysupgrade*" \
              \) \
              | wc -l
          )"

          echo
          echo "Firmware count: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "❌ 没找到 WH3000 Pro sysupgrade 固件"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "✅ 固件生成成功"
          echo "============================================================"

      # ============================================================
      # 19. 准备 Release
      # ============================================================
      - name: 1️⃣9️⃣ 准备 Release 文件
        if: ${{ inputs.upload_release == true }}
        working-directory: openwrt
        run: |
          set -euo pipefail

          rm -rf "${GITHUB_WORKSPACE}/release"
          mkdir -p "${GITHUB_WORKSPACE}/release"

          echo "============================================================"
          echo " 准备 Release 文件"
          echo "============================================================"

          find bin/targets \
            -type f \
            \( \
              -iname "*wh3000*" \
              -o \
              -iname "*huasifei*" \
            \) \
            -exec cp -v {} "${GITHUB_WORKSPACE}/release/" \;

          echo
          echo "Release 文件:"

          ls -lh "${GITHUB_WORKSPACE}/release"

      # ============================================================
      # 20. Actions Artifact
      # ============================================================
      - name: 2️⃣0️⃣ 上传 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-WH3000-Pro
          path: |
            openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 21. GitHub Release
      # ============================================================
      - name: 2️⃣1️⃣ 上传 GitHub Release
        if: ${{ inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " 创建 GitHub Release"
          echo "============================================================"

          VERSION="FanchmWrt-WH3000-Pro-$(date '+%Y%m%d-%H%M%S')"

          BODY="FanchmWrt WH3000 Pro eMMC 自动编译

          Source: ${FANCHMWRT_TAG}
          Device: ${DEVICE}
          Target: ${OPENWRT_TARGET}
          Kernel: 6.12
          Build: GitHub Actions

          本版本为 Huasifei WH3000 Pro eMMC 专用固件。"

          echo
          echo "Release:"
          echo "${VERSION}"

          echo
          echo "Release files:"
          ls -lh release/

          gh release create \
            "${VERSION}" \
            release/* \
            --title "${VERSION}" \
            --notes "${BODY}"

          echo
          echo "============================================================"
          echo "✅ GitHub Release 创建成功"
          echo "============================================================"
