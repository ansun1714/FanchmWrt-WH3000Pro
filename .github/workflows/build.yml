name: 馃彮 FanchmWrt WH3000 Pro 鑷姩缂栬瘧

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '娓呯悊缂栬瘧鐩綍鍚庨噸鏂扮紪璇�'
        required: true
        default: false
        type: boolean
      upload_release:
        description: '缂栬瘧鎴愬姛鍚庤嚜鍔ㄥ垱寤� GitHub Release'
        required: true
        default: true
        type: boolean
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'custom-packages/**'

permissions:
  contents: write

env:
  FANCHMWRT_TAG: fanchmwrt-25.12.4
  BUILD_DIR: openwrt
  DEVICE: huasifei_wh3000-pro-emmc

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget curl xsltproc \
            swig time jq ccache libelf-dev device-tree-compiler \
            genisoimage ecj fastjar java-propose-classpath \
            libpython3-dev python3-setuptools

      - name: Restore downloads cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
          key: fanchmwrt-dl-${{ env.FANCHMWRT_TAG }}-${{ runner.os }}
          restore-keys: |
            fanchmwrt-dl-${{ env.FANCHMWRT_TAG }}-
            fanchmwrt-dl-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-${{ github.ref_name }}
          restore-keys: |
            fanchmwrt-ccache-${{ env.FANCHMWRT_TAG }}-
            fanchmwrt-ccache-

      - name: Clone FanchmWrt
        run: |
          git clone --depth=1 --branch "${FANCHMWRT_TAG}" \
            https://github.com/fanchmwrt/fanchmwrt.git "${BUILD_DIR}"
          cd "${BUILD_DIR}"
          git log -1 --oneline
          git describe --tags --always

      - name: Prepare source and feeds
        run: |
          chmod +x scripts/prepare.sh scripts/diy-part1.sh scripts/diy-part2.sh
          ./scripts/prepare.sh
          ./scripts/diy-part1.sh
          ./scripts/diy-part2.sh

      - name: Show important source files
        working-directory: openwrt
        run: |
          echo "=== WH3000 Pro image definition ==="
          grep -n -A16 -B2 'Device/huasifei_wh3000-pro-emmc' \
            target/linux/mediatek/image/filogic.mk
          echo
          echo "=== WH3000 Pro modem GPIO ==="
          grep -n -A8 -B2 'modem-power' \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi
          echo
          echo "=== Kernel ==="
          grep -n '^KERNEL_PATCHVER' target/linux/mediatek/Makefile

      - name: Clean build tree if requested
        if: ${{ inputs.clean_build == true }}
        working-directory: openwrt
        run: |
          make clean || true
          rm -rf build_dir/target-* staging_dir/target-* tmp

      - name: Download sources
        working-directory: openwrt
        run: |
          make defconfig
          make download -j8 V=s
          find dl -type f -size -1024c -delete || true

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      - name: Validate output
        working-directory: openwrt
        run: |
          echo "=== Firmware files ==="
          find bin/targets -type f \
            \( -name '*sysupgrade*' -o -name '*factory*' -o -name '*.itb' -o -name '*.bin' \) \
            -print | sort
          echo "=== SHA256 ==="
          find bin/targets -type f -print0 | xargs -0 sha256sum > sha256sums.txt
          cat sha256sums.txt

          test -n "$(find bin/targets -type f -name '*sysupgrade*' -print -quit)"

      - name: Collect release files
        run: |
          mkdir -p release
          find openwrt/bin/targets/mediatek/filogic -type f \
            \( -name '*sysupgrade*' -o -name '*factory*' -o -name '*.itb' -o -name '*.bin' \) \
            -exec cp -t release {} +
          cp -a openwrt/sha256sums.txt release/ 2>/dev/null || true

          cat > release/BUILD-INFO.txt <<EOF
          FanchmWrt: ${FANCHMWRT_TAG}
          Device: ${DEVICE}
          Kernel: Linux 6.12 (FanchmWrt MediaTek Filogic)
          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}
          Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          QModem: FUjr/QModem main
          Lucky: gdy666/luci-app-lucky main
          EOF

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-WH3000-Pro-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.upload_release != false && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="WH3000Pro-${FANCHMWRT_TAG}-${GITHUB_RUN_NUMBER}"
          TITLE="WH3000 Pro | FanchmWrt ${FANCHMWRT_TAG} | #${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" release/*.bin release/*.itb release/*.tar.gz release/sha256sums.txt release/BUILD-INFO.txt \
            --title "$TITLE" \
            --notes "FanchmWrt ${FANCHMWRT_TAG} / Huasifei WH3000 Pro eMMC / Linux 6.12 / QModem / Lucky / Docker"

